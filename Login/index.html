<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario visual · Simulación</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="logo" href="../index.php">Ejercicios</a>
        <nav class="navigation">




            <button class="btnLogin-popup">Iniciar sesion</button>
        </nav>
    </header>
    <div class="wrapper">

        <button class="icon-close" type="button" aria-label="Cerrar">×</button>

        <div class="form-box login">
            <h2>Iniciar sesion</h2>
            <form action="#">
                <div class="input-box">

                    <input id="campo-1" type="email" autocomplete="off" required>
                    <label for="campo-1">E-mail</label>
                </div>
                <div class="input-box">

                    <input id="campo-2" type="password" autocomplete="off" required>
                    <label for="campo-2">Contraseña</label>
                </div>
                <div class="remember-forgot">
                    <p>Usá solo datos ficticios.</p>

                </div>
                <button type="submit" class="btn">Iniciar sesion</button>
                <div class="register">

                    <p>¿No tienes cuenta?<a href="#" class="register-link"> Crear cuenta</a></p>
                </div>
            </form>
        </div>



        <div class="form-box register">
            <h2>Registrate</h2>
            <form action="#">

                <div class="input-box">

                    <input id="campo-3" type="text" autocomplete="off" required>
                    <label for="campo-3">Username</label>
                </div>


                <div class="input-box">

                    <input id="campo-4" type="email" autocomplete="off" required>
                    <label for="campo-4">E-mail</label>
                </div>

                <div class="input-box">

                    <input id="campo-5" type="password" autocomplete="off" required>
                    <label for="campo-5">Contraseña</label>
                </div>

                <button type="submit" class="btn">Crear usuario</button>
                <div class="register">

                    <p>¿Ya tienes cuenta?<a href="#" class="login-register"> Iniciar sesion</a></p>
                </div>
            </form>
        </div>


    </div>


    <p id="resultado-demo" role="status">Simulación visual. No se crean cuentas ni se guardan contraseñas.</p>
    <script src="script.js"></script>


</body>

</html>
