<!doctype html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agregar y editar · Práctica</title><link rel="stylesheet" href="styles.css">
</head><body><main>
<a href="../../index.php">Volver a los ejercicios</a><h1>Productos en memoria</h1>
<p>Práctica de formularios y DOM. Los cambios se pierden al recargar; no hay servidor ni base de datos.</p>
<label for="producto">Producto para editar</label><select id="producto"></select>
<button id="editar-button" type="button">Editar</button><button id="agregar-button" type="button">Agregar</button>
<ul id="productos"></ul><p id="resultado" role="status"></p>
<section id="editor" hidden><h2 id="titulo-formulario">Agregar producto</h2>
<form id="formulario">
<label for="nombre">Nombre</label><input id="nombre" required maxlength="80">
<label for="descripcion">Descripción</label><textarea id="descripcion" required maxlength="300"></textarea>
<label for="precio">Precio</label><input id="precio" type="number" min="0.01" max="999999.99" step="0.01" required>
<div><button type="submit">Guardar</button><button id="cancelar" type="button">Cancelar</button></div>
</form></section></main><script src="script.js"></script></body></html>
